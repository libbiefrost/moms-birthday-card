<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday, Mom!</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Montserrat', sans-serif;
  overflow: hidden;
}

.backdrop {
  position: fixed;
  inset: 0;
  background-image: url('https://assets.ppassets.com/p-3s1Tq7toCDIQ3MfjjLuLix/flyer/backdrop_static/jpeg_large');
  background-size: cover;
  background-position: center;
  z-index: 0;
}

.scene {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 320px;
}

.card-slot {
  width: 220px;
  height: 0;
  position: relative;
  overflow: visible;
  transition: height 0.1s;
}

.card-scene {
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 220px;
  height: 308px;
  perspective: 900px;
  transform: translateX(-50%) translateY(288px);
  transition: transform 0.9s cubic-bezier(0.22, 0.61, 0.36, 1);
  z-index: 10;
}

.card-scene.risen {
  transform: translateX(-50%) translateY(0);
}

.card-flip {
  width: 100%; height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.75s cubic-bezier(0.4, 0, 0.2, 1);
}
.card-flip.flipped { transform: rotateY(180deg); }

.card-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: 3px;
  overflow: hidden;
  box-shadow: 0 18px 55px rgba(0,0,0,0.55);
}

.card-front img {
  width: 100%; height: 100%; object-fit: cover; display: block;
  filter: hue-rotate(218deg) saturate(1.3) brightness(0.82);
}

.card-back {
  transform: rotateY(180deg);
  background-image: url('https://assets.ppassets.com/p-6oGyFJ0eKEkUv0YOfqp5kN/flyer/paper_static/base');
  background-size: cover;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 20px;
  gap: 26px;
}
.card-back-top {
  font-weight: 900; font-size: 11px; letter-spacing: 2px;
  text-transform: uppercase; color: #d52229;
  text-align: center; line-height: 1.95;
}
.card-back-bottom {
  font-weight: 900; font-size: 11px; letter-spacing: 2px;
  text-transform: uppercase; color: #523e98;
  text-align: center; line-height: 1.95;
}

.envelope {
  position: relative;
  width: 320px;
  cursor: pointer;
  flex-shrink: 0;
  z-index: 3;
}

.env-body {
  width: 100%;
  height: 196px;
  background: #d52229;
  border-radius: 3px;
  position: relative;
  overflow: hidden;
  box-shadow: inset 0 2px 8px rgba(0,0,0,0.18), 0 8px 32px rgba(0,0,0,0.35);
}

.env-body::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    linear-gradient(135deg, transparent 49.5%, rgba(0,0,0,0.12) 49.5%, rgba(0,0,0,0.12) 50.5%, transparent 50.5%),
    linear-gradient(225deg, transparent 49.5%, rgba(0,0,0,0.12) 49.5%, rgba(0,0,0,0.12) 50.5%, transparent 50.5%);
  pointer-events: none;
}

.env-postmark {
  position: absolute;
  top: 18px;
  right: 90px;
  width: 44px;
  height: 44px;
}

.env-stamp {
  position: absolute;
  top: 10px;
  right: 14px;
  width: 66px;
}

.env-flap {
  position: absolute;
  top: -1px;
  left: 0;
  width: 320px;
  height: 0;
  border-left: 160px solid transparent;
  border-right: 160px solid transparent;
  border-top: 98px solid #b81920;
  transform-origin: top center;
  transform: perspective(500px) rotateX(0deg);
  transition: transform 0.72s cubic-bezier(0.4, 0, 0.6, 1);
  z-index: 4;
  filter: drop-shadow(0 3px 6px rgba(0,0,0,0.25));
}

.env-flap.open {
  transform: perspective(500px) rotateX(175deg);
}

.controls {
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 11px;
  width: 320px;
}

.hint {
  color: rgba(255,255,255,0.85);
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  font-weight: 600;
  text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  min-height: 16px;
  text-align: center;
}

.flip-btn {
  padding: 10px 32px;
  background: rgba(255,255,255,0.14);
  border: 1.5px solid rgba(255,255,255,0.6);
  color: white;
  font-family: 'Montserrat', sans-serif;
  font-size: 9px; font-weight: 700;
  letter-spacing: 2.5px; text-transform: uppercase;
  cursor: pointer;
  opacity: 0; pointer-events: none;
  transition: opacity 0.5s, background 0.2s, transform 0.12s;
}
.flip-btn.visible { opacity: 1; pointer-events: auto; }
.flip-btn:hover { background: rgba(255,255,255,0.26); }
.flip-btn:active { transform: scale(0.97); }
</style>
</head>
<body>

<div class="backdrop"></div>

<div class="scene">

  <div class="card-slot" id="cardSlot">
    <div class="card-scene" id="cardScene">
      <div class="card-flip" id="cardFlip">

        <div class="card-face card-front">
          <img src="https://assets.ppassets.com/p-6SprRvEiCpBdurKekgXEY7/flyer/media_asset/png_xLarge"
               alt="Birthday card front" />
        </div>

        <div class="card-face card-back">
